name: refresh-data

# Every night: pull the City's latest 311 file, rebuild hotspots and the backtest,
# and commit the result. Vercel redeploys from main on its own.
on:
  schedule:
    - cron: "0 9 * * *" # 4am Central (daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REFRESH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - run: pip install -r data/requirements.txt
      - run: python data/scripts/fetch_311.py
      - run: python data/scripts/build_hotspots.py
      - run: python data/scripts/backtest.py
      - name: Commit if anything changed
        run: |
          git add app/data/clean data/backtest
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: nightly data refresh"
          git push
